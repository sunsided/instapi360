[package]
name = "instapi360-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI to list and download original media from the Insta360 cloud."

[[bin]]
name = "instapi360"
path = "src/main.rs"

[dependencies]
instapi360-cloud = { path = "../instapi360-cloud" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "fs", "time"] }
clap = { workspace = true }
anyhow = { workspace = true }
indicatif = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
