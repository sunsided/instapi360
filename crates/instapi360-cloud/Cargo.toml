[package]
name = "instapi360-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
description = "Async client library for the Insta360 cloud: list and download your own original camera media."
categories = ["api-bindings", "multimedia::video"]
documentation = "https://docs.rs/instapi360-cloud"

[dependencies]
tokio = { workspace = true, features = ["rt", "io-util", "macros", "time"] }
reqwest = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
